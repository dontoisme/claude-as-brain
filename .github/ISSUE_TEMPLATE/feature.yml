name: Idea
description: Something the system should do that it doesn't
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened that made you want this
      description: The situation, not the solution. This system is shaped by real use, and a described workflow is worth more than a described feature.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What you'd want it to do
  - type: markdown
    attributes:
      value: "Heads up: this is dogfooded personally and encodes one person's workflow opinions, so expect opinionated pushback. Forks and adaptations are the expected use case."
